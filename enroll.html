<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1646a0" />
  <title>Enroll Now | ManavtaClass</title>
  <link rel="stylesheet" href="/enroll.css" />
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="/enroll.js" defer></script>
</head>

<body>
  <main class="container">
    <header class="brand">
      <h1>ManavtaClass</h1>
      <p>Live Learning · Maths · Science · Olympiad</p>
    </header>

    <section class="card">
      <h2>Choose Your Long-Term Plan</h2>
      <p class="muted">
        Select a plan for your child and enroll securely online.
      </p>

      <form id="enrollmentForm">
        <label for="studentName">Student's Full Name</label>
        <input id="studentName" name="studentName" autocomplete="name" required maxlength="100" />

        <label for="parentPhone">Parent's Phone Number</label>
        <input id="parentPhone" name="parentPhone" type="tel" inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10"
          required />

        <label for="parentEmail">Parent's Email</label>
        <input id="parentEmail" name="parentEmail" type="email" autocomplete="email" required maxlength="254" />

        <label for="plan">Select Long-Term Plan</label>
        <select id="plan" name="plan" required>
          <option value="6-7">Class 6 & 7</option>
          <option value="7-8">Class 7 & 8</option>
          <option value="8-9">Class 8 & 9</option>
          <option value="9-10">Class 9 & 10</option>
          <option value="10-11">Class 10 & 11</option>
        </select>

        <div class="price-box">
          <div class="price-row">
            <span>Original Price</span>
            <span id="originalPrice"></span>
          </div>
          <div class="price-row offer-row">
            <span>Offer Price</span>
            <strong id="offerPrice"></strong>
          </div>
          <p id="savings" class="savings"></p>
        </div>

        <button id="payButton" type="submit">
          Proceed to Secure Payment
        </button>

        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <footer>
      <p>ManavtaClass Live Learning App</p>
      <p>
        <a href="/privacy-policy">Privacy Policy</a>
        ·
        <a href="/terms">Terms & Conditions</a>
      </p>
    </footer>
  </main>
</body>

</html>
