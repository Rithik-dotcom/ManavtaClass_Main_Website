<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1646a0" />
  <title>Enroll Now | ManavtaClass</title>
  <link rel="stylesheet" href="/enroll.css" />
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="/enroll.js" defer></script>
</head>

<body>
  <main class="container">
    <header class="brand">
      <h1>ManavtaClass</h1>
      <p>Live Learning · Maths · Science · Olympiad</p>
    </header>

    <section class="card">
      <h2>Choose Your Long-Term Plan</h2>
      <p class="muted">
        Select a plan for your child and enroll securely online.
      </p>


      <form id="enrollmentForm">
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" name="studentName" required minlength="2" />

        <label for="parentPhone">Parent Phone</label>
        <input type="tel" id="parentPhone" name="parentPhone" required pattern="[6-9][0-9]{9}" maxlength="10" />

        <label for="parentEmail">Parent Email</label>
        <input type="email" id="parentEmail" name="parentEmail" required />

        <label for="plan">Select Course Plan</label>
        <select id="plan" name="plan" required>
          <option value="6-7">Class 6 & 7</option>
          <option value="7-8">Class 7 & 8</option>
          <option value="8-9">Class 8 & 9</option>
          <option value="9-10">Class 9 & 10</option>
          <option value="10-11">Class 10 & 11</option>
        </select>

        <p>Original Price: <span id="originalPrice"></span></p>
        <p>Offer Price: <span id="offerPrice"></span></p>
        <p id="savings"></p>

        <button type="submit" id="payButton">
          Pay Now
        </button>

        <p id="status" role="status" aria-live="polite"></p>
      </form>

    </section>

    <footer>
      <p>ManavtaClass Live Learning App</p>
      <p>
        <a href="/privacy-policy">Privacy Policy</a>
        ·
        <a href="/terms">Terms & Conditions</a>
      </p>
    </footer>
  </main>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="./enroll.js"></script>
</body>

</html>
